# /etc/systemd/system/dnsmasq.service.d/override.conf
#
# Same root cause as the Nginx override in this directory: dnsmasq is
# configured to bind explicitly to the VPN mesh interface's IP (in addition
# to the LAN interface) so it can serve internal-only DNS resolution to VPN
# clients. On boot, that interface can come up a moment after dnsmasq starts
# trying to bind — breaking internal-domain resolution across the whole
# network until dnsmasq is manually restarted.
#
# Mirrors the Nginx fix: wait for the VPN client, then add a small buffer
# before dnsmasq actually starts.

[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=/bin/sleep 5
