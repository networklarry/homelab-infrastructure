# /etc/systemd/system/nginx.service.d/override.conf
#
# PROBLEM:
# Nginx binds to a listen address on the VPN mesh interface (e.g. Tailscale).
# On boot, systemd's `After=`/`Wants=` ordering against the VPN client's
# service unit only guarantees the *unit* has reported "started" — not that
# the *interface* actually has an IP assigned yet. On a cold boot or after a
# gateway/hardware swap, Nginx can start a few hundred milliseconds before
# the interface is truly up, fail to bind, and silently stay down until
# someone notices (or a health check catches it).
#
# FIX:
# Add a short delay before Nginx starts, on top of the existing ordering,
# so the interface has time to come up first.

[Unit]
After=network-online.target tailscaled.service
Wants=network-online.target tailscaled.service

[Service]
ExecStartPre=/bin/sleep 5
